[package]
name = "synthetic-mutating-vtab-ducklink-bridge"
version = "0.2.0"
edition = "2021"
description = "Test-only full-stack storage bridge for the ducklink CLI. Exports guest + callback-dispatch + storage-dispatch + storage-write-dispatch (duckdb:extension@4.0.0) so LOAD + ATTACH ':memory:' AS kv (TYPE synthetic_mutating) plus CRUD round-trip end-to-end against an in-guest synthetic kv_store(key TEXT, value TEXT). Companion to the sqlink synthetic-mutating-vtab-bridge."
license = "Apache-2.0"
publish = false

[workspace]
members = ["."]

[lib]
# The output wasm doubles as the load-time identity. Convention across the
# tegmentum synthetic bridges: `<name>_dynlink.wasm`. This writer component
# is NOT a compose:dynlink bridge (no linker import) -- the suffix is kept
# only for filename symmetry with the sqlink sibling
# (synthetic_mutating_bridge_dynlink.wasm).
name = "synthetic_mutating_ducklink_bridge_dynlink"
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.41", features = ["macros"] }
wit-bindgen-rt = { version = "0.41", features = ["bitflags"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
